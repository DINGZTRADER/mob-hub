name: Verify Cloudflare build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Use audited npm version
        run: npm install --global npm@11.6.2

      - name: Install application dependencies
        run: npm install --package-lock=false

      - name: Lint
        run: npm run lint

      - name: Build OpenNext Worker bundle
        run: npm run cloudflare:build

      - name: Upload OpenNext Worker bundle
        uses: actions/upload-artifact@v4
        with:
          name: mob-hub-opennext-worker
          path: .open-next/
          if-no-files-found: error
          retention-days: 7
